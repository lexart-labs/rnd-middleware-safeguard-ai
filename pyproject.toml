[project]
name = "mope-middleware-safeguard"
version = "0.1.0"
description = "Marginal-latency predictive middleware (MoPE) that safeguards LLM token budgets for Gemini."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "google-generativeai==0.8.6",
    # Pinned to the version that produced the committed .pkl artifacts.
    "scikit-learn==1.8.0",
    "pandas==3.0.3",
    "joblib==1.5.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
